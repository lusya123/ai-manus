services:
  frontend:
    image: simpleyyt/manus-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - manus-network
    environment:
      - BACKEND_URL=http://backend:8000

  backend:
    image: simpleyyt/manus-backend
    depends_on:
      - sandbox
      - claw
    restart: unless-stopped
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv4.conf.all.forwarding: "0"
      net.ipv4.conf.default.forwarding: "0"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv6.conf.default.forwarding: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #- ./mcp.json:/etc/mcp.json # Mount MCP servers directory
    networks:
      - manus-network
      - manus-data-network
    env_file:
      # All configuration is loaded from the .env file, see .env.example
      # More configuration options: https://docs.ai-manus.com/#/configuration
      - .env
    environment:
      # Keep deployment security and runtime isolation as explicit overrides.
      - API_KEY=${API_KEY:?required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?required}
      - REGISTRATION_ENABLED=false
      - DEPLOYMENT_ENVIRONMENT=production
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?required}
      - SANDBOX_IMAGE=simpleyyt/manus-sandbox
      - SANDBOX_NETWORK=manus-network
      - SANDBOX_MEMORY_LIMIT=2g
      - SANDBOX_CPU_LIMIT=2.0
      - SANDBOX_PIDS_LIMIT=512
      - CLAW_IMAGE=simpleyyt/manus-claw
      - CLAW_NETWORK=manus-network
      - RUNTIME_NETWORK_ISOLATION=true
      - RUNTIME_DEPLOYMENT_ID=${RUNTIME_DEPLOYMENT_ID:-ai-manus}
      - CLAW_PUBLISH_HOST_PORTS=false

  sandbox:
    image: simpleyyt/manus-sandbox
    command: /bin/sh -c "exit 0"  # prevent sandbox from starting, ensure image is pulled
    restart: "no"
    networks:
      - manus-network

  claw:
    image: simpleyyt/manus-claw
    entrypoint: /bin/sh -c "exit 0"  # prevent claw from starting, ensure image is pulled
    restart: "no"
    networks:
      - manus-network

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    #ports:
    #  - "27017:27017"
    networks:
      - manus-data-network

  redis:
    image: redis:7.0
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - manus-data-network

volumes:
  mongodb_data:
    name: manus-mongodb-data
  redis_data:
    name: manus-redis-data

networks:
  # Frontend, backend, and user-controlled sandbox/Claw runtimes communicate
  # here. No datastore is attached to this network.
  manus-network:
    name: manus-network
    driver: bridge
  # Backend is the only application service allowed to bridge into this
  # internal datastore network.
  manus-data-network:
    name: manus-data-network
    driver: bridge
    internal: true
