user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Preview bearer tokens live in the path (rather than the query) so relative
    # iframe assets can resolve. Collapse those paths before access logging.
    map $uri $manus_access_uri {
        default $uri;
        ~^/api/v1/sessions/[^/]+/preview/[^/]+(?:/|$) /api/v1/sessions/<redacted>/preview/<redacted>/;
    }

    # Do not log query strings or Referer values: authentication/model handoff
    # parameters and signed resource URLs must never be persisted in logs.
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $manus_access_uri $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            root   /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Preview JWTs are path bearer capabilities. Upstream connection
        # failures can include the raw request line in Nginx's error log, so
        # route every preview-shaped path (including malformed/truncated ones)
        # through a location whose error output is discarded.
        location ~ ^/api/v1/sessions/[^/]+/preview/ {
            error_log /dev/null crit;
            resolver 127.0.0.11 valid=10s;  # Docker DNS
            set $backend_url "${BACKEND_URL}";
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            # Signed file/VNC/share capabilities live in API query strings.
            # Nginx upstream errors include the raw request target, bypassing
            # access-log redaction, so never persist proxy error records here.
            error_log /dev/null crit;
            # Reject oversized multipart bodies at the edge.  The backend
            # repeats this limit while reading chunked bodies, before FastAPI
            # creates UploadFile temporary storage.
            client_max_body_size 26m;
            resolver 127.0.0.11 valid=10s;  # Docker DNS
            set $backend_url "${BACKEND_URL}";
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
